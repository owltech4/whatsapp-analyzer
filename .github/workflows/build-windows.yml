name: Build Windows executable

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app and build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build executable and ZIP package
        shell: pwsh
        run: ./build_windows.ps1 -DependenciesReady

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppAnalyzer-windows
          path: dist/WhatsAppAnalyzer-windows.zip
          if-no-files-found: error
          retention-days: 30

